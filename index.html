<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ปฏิทินวิชาการ</title><meta name="theme-color" content="#171717"><link rel="manifest" href="manifest.webmanifest"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" defer></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script><script src="config.js" defer></script><script src="app.js" defer></script></head><body><header><div class="brand"><span class="logo">BJ.1</span><div><h1>ปฏิทินวิชาการ</h1><p>โรงเรียนบรรหารแจ่มใสวิทยา 1</p></div></div><nav><button id="theme" type="button" aria-pressed="false" aria-label="สลับโหมดกลางวันและกลางคืน">☀ DAY</button><button id="report">รีพอร์ต</button><button id="manage">จัดการกิจกรรม</button></nav></header><main><div id="notice" role="status" aria-live="polite"></div><div id="dashboard" class="dashboard"></div><section class="panel calendar-panel"><div class="filters"><input id="search" placeholder="ค้นหากิจกรรม ผู้รับผิดชอบ สถานที่" aria-label="ค้นหา"><select id="categoryFilter" aria-label="ประเภท"></select><select id="academicFilter" aria-label="ปีการศึกษา"><option value="">ทุกปีการศึกษา</option></select><select id="termFilter" aria-label="ภาคเรียน"><option value="">ทุกภาคเรียน</option><option value="1">ภาคเรียน 1</option><option value="2">ภาคเรียน 2</option></select><select id="statusFilter" aria-label="สถานะ"><option value="">ทุกสถานะ</option><option>ยืนยันกำหนดการ</option><option>รอยืนยัน</option><option>เลื่อนกำหนดการ</option><option>ยกเลิก</option></select><button id="clearFilters">ล้างตัวกรอง</button></div><div class="toolbar month-toolbar"><button id="prev" aria-label="เดือนก่อนหน้า">❮</button><h2 id="month"></h2><select id="monthSelect" aria-label="เดือน"></select><select id="yearSelect" aria-label="ปี"></select><button id="next" aria-label="เดือนถัดไป">❯</button><button id="today">วันนี้</button></div><div class="toolbar view-toolbar"><select id="view" aria-label="มุมมอง"><option value="month">รายเดือน</option><option value="week">รายสัปดาห์</option><option value="year">รายปี</option><option value="agenda">รายการ</option></select><button id="full">เต็มจอ</button><button id="refresh">รีเฟรช</button><small id="updated"></small></div><div id="upcoming"></div><div class="calendar" id="calendar"></div><div id="categoriesLegend" class="legend"></div><p class="legend">🟨 กิจกรรมทั่วไป　<span class="red">● วันหยุด / วันเสาร์–อาทิตย์</span>　▣ วันนี้</p><small id="holidayStatus"></small></section><section class="panel event-panel"><h2 id="listTitle"></h2><div id="events"></div></section></main><dialog id="admin"><div class="toolbar"><h2>จัดการกิจกรรม</h2><button type="button" class="dialog-close" data-close="admin" aria-label="ปิดหน้าต่าง" title="ปิดหน้าต่าง">×</button></div><div id="adminMsg" role="status"></div><form id="login"><label>ชื่อผู้ใช้<input name="username" required autocomplete="username"></label><label>รหัสผ่าน<input name="password" type="password" required autocomplete="current-password"></label><button>เข้าสู่ระบบ</button></form><div id="editor" hidden><button id="logout">ออกจากระบบ</button><form id="eventForm"><input type="hidden" name="__backendId"><input type="hidden" name="version"><div class="fields"><label>วันเริ่มต้น (วัน เดือนย่อ ปี พ.ศ.)<input name="start" placeholder="05 ม.ค. 2569" required></label><label>วันสิ้นสุด (วัน เดือนย่อ ปี พ.ศ.)<input name="end" placeholder="05 ม.ค. 2569"></label><label>ชื่อกิจกรรม<input name="title" required maxlength="300"></label><label>ผู้รับผิดชอบ<input name="owner" maxlength="300"></label><label>สถานที่<input name="place" maxlength="300"></label><label>ประเภท<select name="holiday"><option value="">กิจกรรมทั่วไป</option><option>วันหยุดราชการ</option><option>วันหยุดภายใน</option></select></label><label>เวลาเริ่ม<input type="time" name="startTime"></label><label>เวลาสิ้นสุด<input type="time" name="endTime"></label><label>หมวดหมู่<select name="category" id="categoryEdit"></select></label><label>ฝ่ายงาน<input name="department" maxlength="300"></label><label>กลุ่มเป้าหมาย<input name="audience" maxlength="300"></label><label>สถานะ<select name="status"><option>ยืนยันกำหนดการ</option><option>รอยืนยัน</option><option>เลื่อนกำหนดการ</option><option>ยกเลิก</option></select></label><label>ปีการศึกษา<input name="academicYear" type="number" min="2400" max="2800"></label><label>ภาคเรียน<select name="term"><option value="">ไม่ระบุ</option><option>1</option><option>2</option></select></label><label>ลิงก์เอกสาร<input name="link" type="url"></label><label>เผยแพร่<select name="visibility"><option value="public">สาธารณะ</option><option value="draft">ฉบับร่าง</option></select></label><label>กิจกรรมสำคัญ<select name="pinned"><option value="">ไม่ปักหมุด</option><option value="yes">ปักหมุด</option></select></label><label>ทำซ้ำ (จำนวนครั้ง)<input name="repeatCount" type="number" min="1" max="52" value="1"></label><label>รอบทำซ้ำ<select name="repeatUnit"><option value="week">รายสัปดาห์</option><option value="day">รายวัน</option><option value="month">รายเดือน</option><option value="year">รายปี</option></select></label></div><label>รายละเอียด<textarea name="details" maxlength="3000"></textarea></label><button id="save">บันทึก</button> <button type="button" id="reset">ล้างฟอร์ม</button></form><div class="toolbar"><button id="settings">ตั้งค่า</button><button id="backup">สำรองข้อมูล</button><button id="trash">ถังขยะ</button><button id="audit">ประวัติ</button><button id="importBtn">นำเข้า CSV / Excel</button><input id="importFile" type="file" accept=".csv,.xlsx" hidden><button id="bulkDelete">ลบที่เลือก</button></div><div id="adminList"></div><div id="adminExtra"></div></div></dialog><dialog id="reportDialog"><div class="toolbar no-print"><select id="scope"><option value="month">รายงานเดือนนี้</option><option value="year">รายงานทั้งปี</option><option value="all">รายงานทั้งหมด</option><option value="custom">ช่วงวันที่</option><option value="academic">ปีการศึกษา/ภาคเรียน</option><option value="week">รายสัปดาห์</option></select><input id="reportStart" type="date" aria-label="วันเริ่มรายงาน"><input id="reportEnd" type="date" aria-label="วันสิ้นสุดรายงาน"><input id="reportAcademic" type="number" placeholder="ปีการศึกษา พ.ศ." aria-label="ปีการศึกษา"><select id="reportTerm" aria-label="ภาคเรียน"><option value="">ทุกภาคเรียน</option><option>1</option><option>2</option></select><label><input type="checkbox" id="reportFiltered">ใช้ตัวกรอง</label><select id="paper"><option>A4</option><option>A3</option></select><select id="orientation"><option value="portrait">แนวตั้ง</option><option value="landscape">แนวนอน</option></select><button id="csv">CSV</button><button id="xlsx">Excel</button><button id="calendarPNG">ภาพปฏิทิน</button><button id="ics">ICS</button><button id="png">PNG</button><button id="print">พิมพ์</button><button id="pdf">ดาวน์โหลด PDF</button><button type="button" class="dialog-close" data-close="reportDialog" aria-label="ปิดหน้าต่าง" title="ปิดหน้าต่าง">×</button></div><p id="reportMsg" class="no-print" role="status"></p><div id="reportBody" class="report-sheet"></div></dialog><dialog id="detail"><button type="button" class="dialog-close" data-close="detail" aria-label="ปิดหน้าต่าง" title="ปิดหน้าต่าง">×</button><div id="detailBody"></div></dialog><footer>ปฏิทินวิชาการ • BJ.1</footer></body></html>
